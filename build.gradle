plugins {
    id 'java-library'
    // see https://projects.neoforged.net/neoforged/moddevgradle
    id 'net.neoforged.moddev' version '2.0.148'
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
}

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            ideName = "Carpenter's Blocks ${it.name.capitalize()}"
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            programArgument('--nogui')
            gameDirectory = project.file('runs/server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

processResources {
    var expandProps = [
            'version'                      : version,
            'mod_id'                       : mod_id,
            'mod_name'                     : mod_name,
            'mod_authors'                  : mod_authors,
            'mod_license'                  : mod_license,
            'minecraft_version_range'      : minecraft_version_range,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range
    ]
    filesMatching('META-INF/neoforge.mods.toml') {
        expand expandProps
    }
    inputs.properties(expandProps)

    // The design textures, listed for DesignHandler: the server has no client resources to list them from
    def designRoot = file("src/main/resources/assets/${mod_id}/textures/block/designs")
    inputs.dir(designRoot)
    doLast {
        def lists = [:]
        designRoot.eachDir { dir ->
            lists[dir.name] = dir.listFiles().findAll { it.isFile() && it.name.endsWith('.png') }
                    .collect { it.name[0..-5] }.sort()
        }
        def out = new File(destinationDir, "assets/${mod_id}/designs.json")
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(lists))
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors
        ])
    }
}
